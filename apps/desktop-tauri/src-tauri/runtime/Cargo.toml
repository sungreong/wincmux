[package]
name = "wincmux-runtime"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "wincmux-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
regex = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
vt100 = { path = "../vendor/vt100-0.18.1" }
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
