[package]
name = "wincmux-tauri"
version = "0.1.4"
edition = "2021"
description = "WinCMux Windows terminal workspace"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
base64 = "0.22"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
strip = true
