name: windows-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tauri-build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Setup Rust MSVC
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
      - name: Lint
        run: npm run lint
      - name: Bridge and Rust tests
        run: npm test
      - name: Build Windows installer
        run: npm run package:win -- --ci --no-sign
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WinCMux-Windows-x64
          path: apps/desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
