name: windows-ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  tauri-build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Setup Rust MSVC
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
      - name: Lint
        run: npm run lint
      - name: Bridge and Rust tests
        run: npm test
      - name: Build Windows installer
        run: npm run package:win -- --ci --no-sign
      - name: Runtime process lifecycle tests
        run: npm run test:runtime
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WinCMux-Windows-x64
          path: apps/desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tauri-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinCMux-Windows-x64
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" release-assets/*-setup.exe --title "WinCMux ${GITHUB_REF_NAME#v}" --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*-setup.exe --title "WinCMux ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
