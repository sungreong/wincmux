<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinCMux 프로필 UI 상세 시안</title><style>*{box-sizing:border-box}body{background:#10151c;color:#edf1f7;font:16px 'Malgun Gothic',sans-serif;max-width:1224px;padding:20px;margin:auto}h1{font-size:24px}nav{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}button{font:inherit;color:inherit;background:#222d3b;border:1px solid #47596e;border-radius:5px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#244975;border-color:#93bcfa}img{width:100%;display:block}figure{margin:0}</style><h1>WinCMux 프로필 UI 상세 시안</h1><nav aria-label="화면 선택"><button data-id="01-workspace" aria-pressed="true">작업 화면과 세 가지 진입점</button><button data-id="02-profiles" aria-pressed="false">서버 프로필 관리</button><button data-id="03-register" aria-pressed="false">새 프로필 등록</button><button data-id="04-defaults" aria-pressed="false">워크스페이스 기본 계정</button><button data-id="05-switch" aria-pressed="false">실행 중인 터미널에서 전환</button><button data-id="06-relaunch" aria-pressed="false">실행 방식 선택</button></nav><figure><img src="01-workspace.svg" alt="작업 화면과 세 가지 진입점"></figure><script>const image=document.querySelector('img');for(const b of document.querySelectorAll('button'))b.onclick=()=>{for(const other of document.querySelectorAll('button'))other.setAttribute('aria-pressed',String(other===b));image.src=b.dataset.id+'.svg';image.alt=b.textContent}</script></html>
