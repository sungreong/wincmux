troke="#658ab9"/><text x="352" y="140" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#d2e5ff">Codex · 회사   ▾</text><text x="1007" y="141" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#a6b3c4">분할     숨김     ×</text><text x="266" y="196" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#83d2b2">dev@build-01   /srv/payments</text><text x="266" y="233" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#edf1f7">$ codex</text><text x="266" y="292" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#a6b3c4">›  무엇을 작업할까요?</text><rect x="342" y="157" width="256" height="166" rx="6" fill="#19212c" stroke="#617187"/><text x="356" y="183" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#93bcfa">Codex 프로필</text><rect x="352" y="193" width="236" height="1" rx="0" fill="#34404f" stroke="none"/><text x="358" y="221" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#edf1f7">✓  회사   ·   현재 프로필</text><text x="358" y="260" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#edf1f7">개인</text><text x="358" y="299" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#edf1f7">프로필 관리…</text><rect x="0" y="598" width="1160" height="164" rx="0" fill="#edf1f6" stroke="none"/><text x="24" y="632" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#182634">실행 중인 터미널에서 전환</text><text x="24" y="662" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#33475b">입력 또는 실행 카드로 Codex가 시작되면 터미널 제목 바로 오른쪽에 Codex · 회사 ▾를 표시한다. Claude도 같은 자리다.</text><text x="24" y="689" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#33475b">버튼 높이 32 px. 메뉴는 버튼 하단에서 6 px 아래에 왼쪽 정렬하며 해당 도구의 계정만 표시한다.</text><text x="24" y="716" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#33475b">개인을 선택하면 실행 방식 선택창으로 이동한다. 선택한 이름은 새 CLI의 실행을 확인한 뒤 헤더에 표시한다.</text></svg>
