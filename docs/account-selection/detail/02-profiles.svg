ize="14" font-weight="400" fill="#d2e5ff">+ 프로필 추가</text><text x="300" y="267" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="400" fill="#a6b3c4">프로필 이름</text><text x="540" y="267" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="400" fill="#a6b3c4">인증 상태</text><rect x="294" y="280" width="571" height="1" rx="0" fill="#34404f" stroke="none"/><text x="303" y="316" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#edf1f7">회사</text><text x="540" y="316" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#83d2b2">●  연결됨</text><rect x="830" y="294" width="34" height="32" rx="5" fill="#222d3b" stroke="#34404f"/><text x="840" y="315" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#edf1f7">⋯</text><rect x="294" y="337" width="571" height="1" rx="0" fill="#34404f" stroke="none"/><text x="303" y="373" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#edf1f7">개인</text><text x="540" y="373" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#efcc8a">로그인 필요</text><rect x="727" y="351" width="91" height="32" rx="5" fill="#222d3b" stroke="#34404f"/><text x="737" y="372" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#edf1f7">재로그인</text><rect x="830" y="351" width="34" height="32" rx="5" fill="#222d3b" stroke="#34404f"/><text x="840" y="372" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#edf1f7">⋯</text><rect x="294" y="395" width="571" height="1" rx="0" fill="#34404f" stroke="none"/><text x="298" y="452" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#a6b3c4">⋯   이름 변경 · 로그인 상태 확인 · 등록 해제</text><rect x="0" y="598" width="1160" height="164" rx="0" fill="#edf1f6" stroke="none"/><text x="24" y="632" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#182634">서버 프로필 관리</text><text x="24" y="662" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#33475b">중앙 대화상자 620 × 418 px. 좌상단 도구 탭, 우상단 프로필 추가, 행 오른쪽 개별 관리 메뉴.</text><text x="24" y="689" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#33475b">+ 프로필 추가 → 별칭 입력 → 선택한 서버 사용자 환경에서 공식 로그인 → 상태 확인. 취소하면 로그인 필요로 남긴다.</text><text x="24" y="716" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#33475b">등록 해제 시 참조 중인 워크스페이스를 표시한다. 실행 중인 작업과 인증 파일을 삭제하지 않는다.</text></svg>
