"#658ab9"/><text x="352" y="140" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#d2e5ff">Codex · 회사   ▾</text><text x="1007" y="141" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#a6b3c4">분할     숨김     ×</text><text x="266" y="196" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#83d2b2">dev@build-01   /srv/payments</text><text x="266" y="233" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#edf1f7">$ codex</text><text x="266" y="292" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#a6b3c4">›  무엇을 작업할까요?</text><rect x="0" y="0" width="1160" height="590" rx="0" fill="#080c12aa" stroke="none"/><rect x="290" y="98" width="580" height="342" rx="9" fill="#19212c" stroke="#617187"/><text x="314" y="140" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#edf1f7">개인 프로필로 Codex 시작</text><rect x="823" y="114" width="32" height="32" rx="5" fill="#222d3b" stroke="#34404f"/><text x="833" y="135" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#edf1f7">×</text><text x="314" y="170" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#a6b3c4">결제 서비스   /   터미널 1   ·   회사 → 개인</text><rect x="314" y="188" width="532" height="1" rx="0" fill="#34404f" stroke="none"/><text x="315" y="235" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#edf1f7">새 창에서는 현재 회사 계정의 작업을 계속 볼 수 있습니다.</text><text x="315" y="278" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#edf1f7">이 창에서 다시 시작하면 현재 Codex를 종료하고</text><text x="315" y="307" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#edf1f7">같은 폴더에서 개인 계정의 새 대화를 엽니다.</text><rect x="315" y="366" width="65" height="32" rx="5" fill="#222d3b" stroke="#34404f"/><text x="325" y="387" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#edf1f7">취소</text><rect x="520" y="366" width="171" height="32" rx="5" fill="#222d3b" stroke="#34404f"/><text x="530" y="387" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#edf1f7">이 창에서 다시 시작</text><rect x="700" y="366" width="144" height="32" rx="5" fill="#203650" stroke="#658ab9"/><text x="710" y="387" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400" fill="#d2e5ff">새 창에서 시작</text><rect x="0" y="598" width="1160" height="164" rx="0" fill="#edf1f6" stroke="none"/><text x="24" y="632" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#182634">실행 방식 선택</text><text x="24" y="662" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#33475b">기본 포커스는 새 창에서 시작. 이 창에서 다시 시작을 누르면 안내한 종료에 동의한 것으로 처리한다.</text><text x="24" y="689" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="400" fill="#33475b">대상 인증 상태를 먼저 확인한다. 기존 프로세스 종료가 확인되기 전에는 같은 창에 새 프로세스를 시작하지 않는다.</text></svg>
