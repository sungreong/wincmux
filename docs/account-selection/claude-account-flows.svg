<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810"><rect x="0" y="0" width="1200" height="810" rx="0" fill="#101723" /><text x="30" y="48" fill="#ffffff" font-family="Malgun Gothic, sans-serif" font-size="32" font-weight="700">일반 터미널과 실행 버튼에서 계정 적용하기</text><text x="30" y="84" fill="#b6c7df" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400">WinCMux   /   SSH 개발 서버   /   결제 서비스     ·     기본 프로필   Claude 회사   ·   Codex 개인</text><text x="30" y="140" fill="#9fc4ff" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700">A   터미널에서 직접 시작</text><g id="A1" transform="translate(30 160)"><rect x="0" y="0" width="365" height="248" rx="8" fill="#1c293a" /><text x="16" y="32" fill="#ffffff" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700">일반 터미널 열기</text><text x="16" y="62" fill="#bdcee2" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">도구를 묻지 않고 프롬프트를 연다.</text><rect x="14" y="82" width="337" height="115" rx="8" fill="#101924" /><text x="26" y="108" fill="#a9b9cb" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="400">결제 서비스   /   터미널 1</text><text x="26" y="140" fill="#9fc4ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700">Claude · 회사     Codex · 개인</text><rect x="24" y="151" width="145" height="36" rx="8" fill="#29425b" /><text x="34" y="176" fill="#edf3ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">$ ▌</text><text x="15" y="225" fill="#d6e1ef" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">두 프로필 경로를 셸에 함께 전달한다.</text></g><g id="A2" transform="translate(415 160)"><rect x="0" y="0" width="365" height="248" rx="8" fill="#1c293a" /><text x="16" y="32" fill="#ffffff" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700">claude를 입력하면</text><text x="16" y="62" fill="#bdcee2" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">같은 셸에서 Claude를 시작하는 경우</text><rect x="14" y="82" width="337" height="115" rx="8" fill="#101924" /><text x="26" y="108" fill="#a9b9cb" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="400">결제 서비스   /   터미널 1</text><text x="26" y="140" fill="#9fc4ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700">Claude 프로필   회사</text><rect x="24" y="151" width="145" height="36" rx="8" fill="#182a38" /><text x="34" y="176" fill="#edf3ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">$ claude</text><text x="15" y="225" fill="#d6e1ef" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">Claude가 회사 프로필을 읽는다.</text></g><g id="A3" transform="translate(800 160)"><rect x="0" y="0" width="365" height="248" rx="8" fill="#1c293a" /><text x="16" y="32" fill="#ffffff" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700">codex를 입력하면</text><text x="16" y="62" fill="#bdcee2" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">같은 셸에서 Codex를 시작하는 경우</text><rect x="14" y="82" width="337" height="115" rx="8" fill="#101924" /><text x="26" y="108" fill="#a9b9cb" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="400">결제 서비스   /   터미널 1</text><text x="26" y="140" fill="#9fc4ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700">Codex 프로필   개인</text><rect x="24" y="151" width="145" height="36" rx="8" fill="#182a38" /><text x="34" y="176" fill="#edf3ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">$ codex</text><text x="15" y="225" fill="#d6e1ef" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">Codex가 개인 프로필을 읽는다.</text></g><text x="30" y="468" fill="#9adfbe" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700">B   Claude 버튼으로 시작</text><g id="B1" transform="translate(30 488)"><rect x="0" y="0" width="365" height="248" rx="8" fill="#1c293a" /><text x="16" y="32" fill="#ffffff" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700">Claude 버튼 확인</text><text x="16" y="62" fill="#bdcee2" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">새 창의 실행 카드에 적용할 계정을 표시한다.</text><rect x="14" y="82" width="337" height="115" rx="8" fill="#101924" /><text x="26" y="108" fill="#a9b9cb" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="400">결제 서비스   /   새 터미널</text><text x="26" y="140" fill="#9adfbe" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700">Claude 계정   회사  ▾</text><rect x="24" y="151" width="145" height="36" rx="8" fill="#29425b" /><text x="34" y="176" fill="#edf3ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">Claude 실행</text><text x="15" y="225" fill="#d6e1ef" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">바로 누르면 기본값인 회사로 실행한다.</text></g><g id="B2" transform="translate(415 488)"><rect x="0" y="0" width="365" height="248" rx="8" fill="#1c293a" /><text x="16" y="32" fill="#ffffff" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700">이번 창의 계정 선택</text><text x="16" y="62" fill="#bdcee2" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">개인으로 실행하려면 계정 메뉴를 연다.</text><rect x="14" y="82" width="337" height="115" rx="8" fill="#101924" /><text x="26" y="108" fill="#a9b9cb" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="400">결제 서비스   /   새 터미널</text><text x="26" y="140" fill="#9adfbe" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700">✓  회사   ·   프로젝트 기본</text><rect x="24" y="151" width="145" height="36" rx="8" fill="#29425b" /><text x="34" y="176" fill="#edf3ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">○  개인</text><text x="15" y="225" fill="#d6e1ef" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">개인을 선택하면 메뉴가 닫히고 카드로 돌아온다.</text></g><g id="B3" transform="translate(800 488)"><rect x="0" y="0" width="365" height="248" rx="8" fill="#1c293a" /><text x="16" y="32" fill="#ffffff" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700">개인 계정으로 실행</text><text x="16" y="62" fill="#bdcee2" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">선택한 이름을 확인하고 실행한다.</text><rect x="14" y="82" width="337" height="115" rx="8" fill="#101924" /><text x="26" y="108" fill="#a9b9cb" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="400">결제 서비스   /   새 터미널</text><text x="26" y="140" fill="#9adfbe" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="700">Claude 계정   개인  ▾</text><rect x="24" y="151" width="145" height="36" rx="8" fill="#29425b" /><text x="34" y="176" fill="#edf3ff" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">Claude 실행</text><text x="15" y="225" fill="#d6e1ef" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="400">개인 프로필로 시작하고 터미널에 초점을 둔다.</text></g><text x="30" y="779" fill="#c1cfe1" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400">공통 규칙     계정 선택은 이번 터미널에 적용한다. 기본 계정 변경은 워크스페이스 설정에서 한다.</text></svg>