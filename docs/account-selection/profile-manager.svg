<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" fill="#111a26"/><text x="32" y="53" font-family="Malgun Gothic, sans-serif" font-size="30" fill="#edf3ff">도구 프로필 관리와 실행 중 계정 전환</text><text x="32" y="88" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#a6bdd7">SSH 개발 서버   /   결제 서비스</text><g id="screen-1"><rect x="32" y="122" width="330" height="360" rx="12" fill="#213045"/><text x="50" y="163" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#edf3ff">프로필 관리</text><rect x="46" y="188" width="302" height="75" rx="7" fill="#132030"/><text x="57" y="217" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">Claude    |    Codex</text><text x="57" y="245" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">도구별로 계정을 등록합니다.</text><rect x="46" y="279" width="302" height="75" rx="7" fill="#132030"/><text x="57" y="308" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">회사     연결됨 · 기본</text><text x="57" y="336" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">개인     로그인 필요</text><rect x="46" y="370" width="302" height="75" rx="7" fill="#132030"/><text x="57" y="399" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">+ 프로필 추가</text><text x="57" y="427" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">이름 변경  /  재로그인  /  해제</text></g><g id="screen-2"><rect x="382" y="122" width="330" height="360" rx="12" fill="#213045"/><text x="400" y="163" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#edf3ff">실행 중인 터미널</text><rect x="396" y="188" width="302" height="75" rx="7" fill="#132030"/><text x="407" y="217" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">Claude · 회사  ▾</text><text x="407" y="245" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">회사  ✓      개인</text><rect x="396" y="279" width="302" height="75" rx="7" fill="#132030"/><text x="407" y="308" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">또는   Codex · 개인  ▾</text><text x="407" y="336" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">개인  ✓      회사</text><rect x="396" y="370" width="302" height="75" rx="7" fill="#132030"/><text x="407" y="399" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">프로필 관리…</text><text x="407" y="427" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">실행한 도구의 계정만 표시</text></g><g id="screen-3"><rect x="732" y="122" width="330" height="360" rx="12" fill="#213045"/><text x="750" y="163" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#edf3ff">선택한 프로필로 시작</text><rect x="746" y="188" width="302" height="75" rx="7" fill="#132030"/><text x="757" y="217" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">새 창에서 시작</text><text x="757" y="245" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">같은 폴더에 새 대화 열기</text><rect x="746" y="279" width="302" height="75" rx="7" fill="#132030"/><text x="757" y="308" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">이 창에서 다시 시작</text><text x="757" y="336" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">현재 작업 종료 확인 후 실행</text><rect x="746" y="370" width="302" height="75" rx="7" fill="#132030"/><text x="757" y="399" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#a9d4ff">취소</text><text x="757" y="427" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#edf3ff">기존 터미널로 돌아가기</text></g><text x="32" y="524" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#b9cce0">같은 창에서 계정을 바꾸면 선택한 프로필로 CLI를 다시 시작합니다.</text></svg>
